<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>I Am Attending | Bring Back The Glory</title>
<meta name="description" content="Upload your photo and create your personalized 'I Am Attending' flyer for Bring Back the Glory.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@700;800&family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#050c24;
    --navy2:#0a1642;
    --gold:#f2c14e;
    --cyan:#4fd3ff;
    --card:#101a3d;
    --hero-glow: radial-gradient(circle at 50% -10%, #302670 0%, #101948 40%, #050a22 100%);
    --card-border: rgba(255, 255, 255, 0.09);
    --text-muted: #9eb1da;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background:#05091e;
    background-image: var(--hero-glow);
    background-attachment: fixed;
    color:#fff;
    font-family:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height:100vh;
    line-height:1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:16px 16px 60px;
  }


  /* --- Hero Section --- */
  .hero-section{
    text-align:center;
    margin-bottom:28px;
    padding:0 4px;
  }
  .hero-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:8px 18px;
    background:rgba(255, 255, 255, 0.08);
    border:1px solid rgba(255, 255, 255, 0.14);
    border-radius:9999px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    margin-bottom:18px;
  }
  .hero-badge .badge-text{
    font-size:13.5px;
    color:#dbe5fa;
    font-weight:600;
    letter-spacing:0.2px;
  }
  .hero-title{
    font-size: clamp(34px, 8.5vw, 54px);
    font-weight: 800;
    line-height: 1.16;
    letter-spacing: -0.8px;
    color: #ffffff;
    margin-bottom: 18px;
    text-wrap: balance;
  }
  .hero-title-lead{
    display: inline;
  }
  .hero-title .glory-italic{
    font-family: 'Playfair Display', Georgia, serif;
    font-style: italic;
    font-weight: 700;
    color: #ffd028;
    font-size: 1.12em;
    text-shadow: 0 0 28px rgba(255, 208, 40, 0.45);
    letter-spacing: -0.3px;
    display: inline-block;
    padding-left: 2px;
  }
  .hero-lead{
    font-size:14.5px;
    line-height:1.65;
    color:var(--text-muted);
    max-width:480px;
    margin:0 auto 24px;
  }
  .hero-logo{
    width:64px;
    height:64px;
    object-fit:contain;
    display:block;
    margin:4px auto 16px;
    filter:drop-shadow(0 2px 10px rgba(0,0,0,0.4));
  }

  /* --- Stage & Canvas --- */
  .stage{
    position:relative;
    width:100%;
    border-radius:18px;
    overflow:hidden;
    background:#000;
    border:1px solid rgba(255, 255, 255, 0.1);
    box-shadow:0 14px 44px rgba(0,0,0,0.55);
    touch-action:none;
  }
  .stage canvas{
    display:block;
    width:100%;
    height:auto;
  }
  .stage .empty-hint{
    position:absolute;
    left:50%;
    top:58%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:#e0edff;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.2px;
    background:rgba(8, 14, 38, 0.78);
    border:1px dashed rgba(79, 211, 255, 0.55);
    padding:7px 14px;
    border-radius:20px;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    cursor:pointer;
    pointer-events:auto;
    transition:all 0.15s ease;
    user-select:none;
    -webkit-user-select:none;
    white-space:nowrap;
    box-shadow:0 4px 16px rgba(0,0,0,0.5);
    z-index:2;
  }
  .stage .empty-hint:hover{
    background:rgba(14, 24, 64, 0.92);
    border-color:var(--cyan);
    transform:translate(-50%,-53%);
  }
  .stage .empty-hint:active{
    transform:translate(-50%,-47%) scale(0.96);
  }
  .panel{
    background:rgba(16, 26, 61, 0.85);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255, 255, 255, 0.08);
    border-radius:18px;
    padding:18px;
    margin-top:16px;
    box-shadow:0 10px 30px rgba(0, 0, 0, 0.25);
  }
  .row{
    display:flex;
    gap:10px;
    margin-bottom:12px;
  }
  .row:last-child{margin-bottom:0;}
  label{
    display:block;
    font-size:13px;
    color:#a9bce0;
    margin-bottom:6px;
    font-weight:600;
  }
  input[type="text"]{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid #2a3a6b;
    background:#0b1330;
    color:#fff;
    font-size:15px;
    outline:none;
  }
  input[type="text"]:focus{
    border-color:var(--cyan);
  }
  input[type="file"]{
    display:none;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:13px 18px;
    border-radius:10px;
    border:none;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    text-decoration:none;
    transition:transform .08s ease, opacity .15s ease;
    width:100%;
  }
  .btn:active{ transform:scale(0.98); }
  .btn-primary{
    background:linear-gradient(135deg,var(--cyan),#2f9bff);
    color:#001225;
  }
  .btn-gold{
    background:linear-gradient(135deg,#ffe08a,var(--gold));
    color:#3a2a00;
  }
  .btn-ghost{
    background:#1a2652;
    color:#cfe0ff;
  }
  .btn:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }
  .zoom-row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  input[type="range"]{
    flex:1;
    accent-color:var(--cyan);
  }
  .grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .hint{
    font-size:12px;
    color:#8fa1cc;
    margin-top:14px;
    line-height:1.55;
    text-align:center;
    max-width:460px;
    margin-left:auto;
    margin-right:auto;
  }
  .badge{
    display:inline-block;
    background:#1a2652;
    color:#8fd9ff;
    font-size:11px;
    padding:3px 8px;
    border-radius:6px;
    margin-bottom:10px;
  }
  html{
    scroll-behavior:smooth;
  }

  @media (max-width:480px){
    .wrap{ padding:14px 12px 40px; }
    .hero-title{ font-size: clamp(28px, 8.8vw, 38px); line-height: 1.2; margin-bottom:16px; letter-spacing: -0.5px; }
    .hero-title-lead{ display: block; margin-bottom: 2px; }
    .hero-title .glory-italic{ display: inline-block; font-size: 1.15em; }
    .hero-lead{ font-size:13.5px; }
    .panel{ padding:14px; }
    .btn{ font-size:14px; padding:12px 14px; }
    .stage .empty-hint{ font-size:11px; padding:6px 12px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero-section">
    <img src="icon_of_praise.png" alt="Icon of Praise" class="hero-logo">
    <div class="hero-badge">
      <span class="badge-text">Sunday, 11th October 2026</span>
    </div>
    <h1 class="hero-title">
      <span class="hero-title-lead">Bring Back the</span>
      <span class="glory-italic">Glory</span>
    </h1>
    <p class="hero-lead">
      Add your photo and name, then download your personal "I Am Attending" flyer and share it.
    </p>
  </header>

  <div class="stage" id="stage">
    <canvas id="canvas" width="1600" height="2000"></canvas>
    <div class="empty-hint" id="emptyHint" title="Tap to upload photo">Tap to Upload Photo</div>
  </div>


  <div class="panel">
    <div class="row">
      <input type="file" id="fileInput" accept="image/*">
      <button class="btn btn-primary" id="uploadBtn">📷 Upload Photo</button>
    </div>

    <div class="row" id="zoomRow" style="display:none;">
      <div style="width:100%;">
        <label>Zoom &amp; Position</label>
        <div class="zoom-row">
          <span style="font-size:18px;">－</span>
          <input type="range" id="zoomSlider" min="100" max="300" value="100">
          <span style="font-size:18px;">＋</span>
        </div>
      </div>
    </div>

    <div class="row" id="resetRow" style="display:none;">
      <button class="btn btn-ghost" id="resetBtn">↺ Reset Position</button>
    </div>

    <div class="row">
      <div style="width:100%;">
        <label for="nameInput">Your Name</label>
        <input type="text" id="nameInput" placeholder="Type your name" maxlength="40">
      </div>
    </div>

    <div class="row">
      <button class="btn btn-gold" id="downloadBtn" disabled>⬇ Download My Flyer</button>
    </div>
  </div>

</div>

  let photoImg = null;
  let photo = { scale:1, baseScale:1, offX:0, offY:0, natW:0, natH:0 };
  let personName = '';

  function roundRectPath(c, x, y, w, h, r){
    c.beginPath();
    c.moveTo(x+r, y);
    c.arcTo(x+w, y,   x+w, y+h, r);
    c.arcTo(x+w, y+h, x,   y+h, r);
    c.arcTo(x,   y+h, x,   y,   r);
    c.arcTo(x,   y,   x+w, y,   r);
    c.closePath();
  }

  function clampOffsets(){
    const scaledW = photo.natW * photo.scale;
    const scaledH = photo.natH * photo.scale;
    const maxX = Math.max(0, (scaledW - SLOT.w) / 2);
    const maxY = Math.max(0, (scaledH - SLOT.h) / 2);
    photo.offX = Math.min(maxX, Math.max(-maxX, photo.offX));
    photo.offY = Math.min(maxY, Math.max(-maxY, photo.offY));
  }

  const NAME_FONT = '"DM Sans", Arial, sans-serif';
  const TRACKING = -0.03; // tight letter-spacing, as a fraction of font size

  function tightWidth(text, spacing){
    let total = 0;
    for (const ch of text) total += ctx.measureText(ch).width + spacing;
    return total - spacing;
  }

  function fitFontSize(text, maxWidth, maxHeight){
    let size = Math.floor(maxHeight * 0.62);
    ctx.font = `800 ${size}px ${NAME_FONT}`;
    let spacing = size * TRACKING;
    while (tightWidth(text, spacing) > maxWidth && size > 10){
      size -= 2;
      ctx.font = `800 ${size}px ${NAME_FONT}`;
      spacing = size * TRACKING;
    }
    return size;
  }

  function drawTightText(text, cx, cy, spacing){
    const totalWidth = tightWidth(text, spacing);
    let x = cx - totalWidth / 2;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    for (const ch of text){
      ctx.fillText(ch, x, cy);
      x += ctx.measureText(ch).width + spacing;
    }
  }

  function render(){
    ctx.clearRect(0,0,CW,CH);
    if (bgLoaded){
      ctx.drawImage(bgImg, 0, 0, CW, CH);
    }

    if (photoImg){
      ctx.save();
      roundRectPath(ctx, SLOT.x, SLOT.y, SLOT.w, SLOT.h, SLOT.r);
      ctx.clip();
      const scaledW = photo.natW * photo.scale;
      const scaledH = photo.natH * photo.scale;
      const cx = SLOT.x + SLOT.w/2 + photo.offX;
      const cy = SLOT.y + SLOT.h/2 + photo.offY;
      ctx.drawImage(photoImg, cx - scaledW/2, cy - scaledH/2, scaledW, scaledH);
      ctx.restore();
    }

    if (personName.trim().length){
      const text = personName.trim().toUpperCase();
      ctx.save();
      const pad = 24;
      const size = fitFontSize(text, NAME.w - pad*2, NAME.h);
      ctx.font = `800 ${size}px ${NAME_FONT}`;
      ctx.fillStyle = '#0b1330';
      drawTightText(text, NAME.x + NAME.w/2, NAME.y + NAME.h/2 + 2, size * TRACKING);
      ctx.restore();
    }
  }

  // ---- File upload ----
  const fileInput = document.getElementById('fileInput');
  const uploadBtn = document.getElementById('uploadBtn');
  uploadBtn.addEventListener('click', () => fileInput.click());
  emptyHint.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        photoImg = img;
        photo.natW = img.naturalWidth;
        photo.natH = img.naturalHeight;
        photo.baseScale = Math.max(SLOT.w / photo.natW, SLOT.h / photo.natH);
        photo.scale = photo.baseScale;
        photo.offX = 0;
        photo.offY = 0;
        zoomSlider.value = 100;
        emptyHint.style.display = 'none';
        zoomRow.style.display = 'flex';
        resetRow.style.display = 'flex';
        downloadBtn.disabled = false;
        render();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  // ---- Zoom slider ----
  const zoomRow = document.getElementById('zoomRow');
  const resetRow = document.getElementById('resetRow');
  const zoomSlider = document.getElementById('zoomSlider');
  zoomSlider.addEventListener('input', () => {
    if (!photoImg) return;
    const factor = parseInt(zoomSlider.value, 10) / 100;
    photo.scale = photo.baseScale * factor;
    clampOffsets();
    render();
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    if (!photoImg) return;
    photo.scale = photo.baseScale;
    photo.offX = 0;
    photo.offY = 0;
    zoomSlider.value = 100;
    render();
  });

  // ---- Drag to reposition (mouse + single touch) ----
  let dragging = false;
  let lastX = 0, lastY = 0;

  function canvasScale(){
    const rect = canvas.getBoundingClientRect();
    return CW / rect.width;
  }

  function pointerDown(x, y){
    if (!photoImg) return;
    dragging = true;
    lastX = x; lastY = y;
  }
  function pointerMove(x, y){
    if (!dragging || !photoImg) return;
    const s = canvasScale();
    photo.offX += (x - lastX) * s;
    photo.offY += (y - lastY) * s;
    lastX = x; lastY = y;
    clampOffsets();
    render();
  }
  function pointerUp(){ dragging = false; }

  canvas.addEventListener('mousedown', (e) => pointerDown(e.clientX, e.clientY));
  window.addEventListener('mousemove', (e) => pointerMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', pointerUp);

  // Touch: single-finger drag, two-finger pinch zoom
  let pinchStartDist = 0;
  let pinchStartScale = 1;

  function touchDist(t0, t1){
    const dx = t0.clientX - t1.clientX;
    const dy = t0.clientY - t1.clientY;
    return Math.sqrt(dx*dx + dy*dy);
  }

  canvas.addEventListener('touchstart', (e) => {
    if (!photoImg) return;
    if (e.touches.length === 1){
      pointerDown(e.touches[0].clientX, e.touches[0].clientY);
    } else if (e.touches.length === 2){
      dragging = false;
      pinchStartDist = touchDist(e.touches[0], e.touches[1]);
      pinchStartScale = photo.scale;
    }
    e.preventDefault();
  }, {passive:false});

  canvas.addEventListener('touchmove', (e) => {
    if (!photoImg) return;
    if (e.touches.length === 1 && dragging){
      pointerMove(e.touches[0].clientX, e.touches[0].clientY);
    } else if (e.touches.length === 2){
      const dist = touchDist(e.touches[0], e.touches[1]);
      const factor = dist / pinchStartDist;
      let newScale = pinchStartScale * factor;
      const minScale = photo.baseScale;
      const maxScale = photo.baseScale * 3;
      newScale = Math.min(maxScale, Math.max(minScale, newScale));
      photo.scale = newScale;
      zoomSlider.value = Math.round((newScale / photo.baseScale) * 100);
      clampOffsets();
      render();
    }
    e.preventDefault();
  }, {passive:false});

  canvas.addEventListener('touchend', () => { dragging = false; });

  // Desktop scroll wheel = zoom
  canvas.addEventListener('wheel', (e) => {
    if (!photoImg) return;
    e.preventDefault();
    const delta = e.deltaY > 0 ? -5 : 5;
    let val = parseInt(zoomSlider.value, 10) + delta;
    val = Math.min(300, Math.max(100, val));
    zoomSlider.value = val;
    photo.scale = photo.baseScale * (val/100);
    clampOffsets();
    render();
  }, {passive:false});

  // ---- Name input ----
  const nameInput = document.getElementById('nameInput');
  nameInput.addEventListener('input', () => {
    personName = nameInput.value;
    render();
  });

  // ---- Download ----
  const downloadBtn = document.getElementById('downloadBtn');
  downloadBtn.addEventListener('click', () => {
    render();
    canvas.toBlob((blob) => {
      if (!blob){
        alert('Could not generate the image. Please try again.');
        return;
      }
      const url = URL.createObjectURL(blob);
      const safeName = (personName.trim() || 'my-flyer').replace(/[^a-z0-9]+/gi, '-');
      const a = document.createElement('a');
      a.href = url;
      a.download = `I-Am-Attending-${safeName}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }, 'image/png');
  });

  render();
})();
</script>
